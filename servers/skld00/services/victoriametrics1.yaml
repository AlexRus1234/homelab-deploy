# Декларация инстанса VictoriaMetrics (victoriametrics1) на skld00.
#
# Подаётся напрямую:  incus-loc launch leap16-base victoriametrics1 < этот файл
# и разбирается хостовым контуром: servers/skld00/reconcile.sh
#
# Данные — заранее созданный датасет `tank/vm-data` (recordsize=16K под мелкие
# случайные записи метрик), владельца датасета (100000+uid) ставит хостовый контур
# до запуска сервиса — см. services/README.md.
#
# Сеть (замерено на живом Incus 2026-10-13): три плеча — два macvlan на физических картах
# узла и приватный бридж Incus под наблюдаемость.
#   eth0 — LAN, адрес по DHCP от роутера (имя `eth0` подхватывает запёкшийся в базе
#          eth0.network с DHCP=ipv4 и ClientIdentifier=mac), MAC объявлен константой →
#          резервация на роутере (MAC → 172.20.50.100) переживает пересоздание инстанса.
#          Профильное `eth0` (бридж incusbr0) перебито одноимённым устройством инстанса.
#   eth1 — прямой линк skld00↔yadr01 (карта enp8s0, пир 172.21.6.250): статика из
#          user-data, без шлюза — DHCP-сервера на линке нет. Последний байт адреса — тот же,
#          что в LAN (`172.20.50.100` ↔ `172.21.6.100`): у сервиса одна схема адресации.
#   eth2 — приватная сеть узла `observ0` (`172.26.50.0/24`, DHCP и NAT выключены, из LAN
#          не маршрутизируется; см. 01_архитектура_и_сеть.md). По ней узел отдаёт инстансам
#          свои метрики и логи, не выставляя сборщики в LAN. Адрес — статикой, без шлюза,
#          последний байт по той же схеме (`172.26.50.100`); узел виден тут как `172.26.50.1`
#          (адрес бриджа) — на него и смотрит скрейп.
name: victoriametrics1
description: "VictoriaMetrics single-node (victoriametrics-loc): приём и хранение метрик"

config:
  # --- ресурсы: метрикам нужнее память и диск, чем ядра ---
  limits.cpu: "4"
  limits.memory: 4GiB

  # --- политика для хостового контура ---
  user.managed-by: homelab-deploy/skld00     # маркер: без него контур инстанс не трогает и не снимает
  user.role: victoriametrics
  user.package: victoriametrics-loc
  user.update_policy: inplace          # историю метрик сохраняем, меняются версии пакетов
  user.rollback_window: 24h            # сколько живут снапшоты после обновления
  user.boot_marker: /run/lxc-boot-ok
  user.healthcheck: "curl -fsS --max-time 5 http://127.0.0.1:8428/health >/dev/null && systemctl is-active --quiet victoriametrics-loc"
  user.data_dataset: tank/vm-data
  user.data_mountpoint: /var/lib/victoriametrics-loc

  # uid не объявляется: контур читает его из инстанса и от него считает хозяина данных
  # на хосте (100000+uid). Пакет создаёт пользователя сам, номер от нас не зависит.

  cloud-init.user-data: |
    #cloud-config
    write_files:
      - path: /etc/zypp/repos.d/zypper-sle-alexrus1234.repo
        permissions: '0644'
        content: |
          [zypper-sle-alexrus1234]
          name=zypper-sle-alexrus1234 (личный rpm-md, Хражевник)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/repo/zypper-sle-alexrus1234
          enabled=1
          autorefresh=0
          type=rpm-md
          gpgcheck=0
      - path: /etc/systemd/network/20-eth1.network
        permissions: '0644'
        content: |
          # Прямой линк skld00 <-> yadr01: статика, шлюза нет (пир 172.21.6.250 на линке же).
          [Match]
          Name=eth1

          [Network]
          Address=172.21.6.100/24
      - path: /etc/systemd/network/21-eth2.network
        permissions: '0644'
        content: |
          # Приватная сеть узла observ0: сюда приходит служебный трафик наблюдаемости.
          # Шлюза нет намеренно — маршрут по умолчанию у сервиса один и он принадлежит LAN.
          [Match]
          Name=eth2

          [Network]
          Address=172.26.50.100/24
      # Скрейп-конфиг и аргументы юнита вынесены рядом с декларацией (services/victoriametrics1/):
      # правка этих файлов меняет состав декларации, поэтому инстанс пересоздаётся — конфиг на
      # площадке не расходится с гитом.
      - path: /etc/victoriametrics-loc/scrape.yml
        permissions: '0644'
        content_file: victoriametrics1/scrape.yml
      - path: /etc/victoriametrics-loc/victoriametrics-loc.conf
        permissions: '0644'
        content_file: victoriametrics1/victoriametrics-loc.conf
    runcmd:
      - |
        set -euo pipefail
        # Сеть: LAN-плечо — DHCP (запёкшийся файл образа), линк — статика. Ждём LAN-адрес
        # ограниченно: без него не дойти до Хражевника, и «поставить пакет в пустоту» нельзя.
        for i in $(seq 1 20); do
          ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' && break
          sleep 2
        done
        ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' \
          || { echo "LAN (eth0): адрес по DHCP не пришёл за 40 с"; exit 1; }
        networkctl reload >/dev/null 2>&1 || true
        networkctl reconfigure eth1 >/dev/null 2>&1 || true
        ip -4 -o addr show dev eth1 2>/dev/null | grep -q '172\.21\.6\.100' \
          || { echo "линк (eth1): адрес 172.21.6.100 не поднялся"; exit 1; }
        networkctl reconfigure eth2 >/dev/null 2>&1 || true
        ip -4 -o addr show dev eth2 2>/dev/null | grep -q '172\.26\.50\.100' \
          || { echo "приватная сеть (eth2): адрес 172.26.50.100 не поднялся"; exit 1; }
        # Только пакет и включение юнита: запуск делает хостовый контур после chown
        # датасета (внутри контейнера владельца примонтированного датасета не сменить).
        test -f /etc/pki/trust/anchors/step-ca.crt
        update-ca-certificates >/dev/null
        test -f /etc/zypp/repos.d/khrazhevnik-leap16-oss.repo
        if ls /etc/zypp/repos.d/openSUSE*.repo >/dev/null 2>&1; then
          echo "в образе апстримный репозиторий — путь нарушен"; exit 1
        fi
        zypper --non-interactive --gpg-auto-import-keys refresh
        zypper --non-interactive install -y --no-recommends victoriametrics-loc
        rpm -q victoriametrics-loc >/dev/null
        systemctl enable --now victoriametrics-loc.service >/dev/null
        echo "victoriametrics1: сеть поднята ($(ip -4 -o addr show dev eth0 | awk '{print $4}' | head -1) / $(ip -4 -o addr show dev eth1 | awk '{print $4}' | head -1) / $(ip -4 -o addr show dev eth2 | awk '{print $4}' | head -1)), пакет установлен, юнит включён (uid $(id -u victoriametrics-loc))"

devices:
  # LAN-плечо: macvlan на физической карте узла (см. комментарий в шапке). Адрес — по DHCP,
  # в декларации его нет: macvlan ключ ipv4.address не принимает (замерено).
  eth0:
    type: nic
    nictype: macvlan
    parent: enp7s0
    name: eth0
    hwaddr: "02:76:6d:00:00:02"
  # Линк до yadr01: та же механика на второй карте, адрес — статикой из user-data.
  eth1:
    type: nic
    nictype: macvlan
    parent: enp8s0
    name: eth1
    hwaddr: "02:76:6d:01:00:02"
  # Приватная сеть узла (бридж Incus `observ0`): DHCP и NAT выключены, из LAN не
  # маршрутизируется — служебный трафик наблюдаемости идёт здесь и наружу не виден.
  # Адрес — файлом в user-data; шлюза нет, маршрут по умолчанию остаётся у LAN.
  eth2:
    type: nic
    network: observ0
    name: eth2
    hwaddr: "02:76:6d:02:00:02"
  data:
    type: disk
    source: /tank/vm-data
    path: /var/lib/victoriametrics-loc
