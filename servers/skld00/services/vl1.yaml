# Декларация инстанса VictoriaLogs (vl1) на skld00.
#
# Подаётся напрямую:  incus-loc launch leap16-base vl1 < этот файл
# и разбирается хостовым контуром: servers/skld00/reconcile.sh
#
# Раскладка: базовый образ — артефакт со склада (`leap16-base`, живёт на tank/incus),
# данные — заранее созданный датасет `tank/vl-data` (recordsize=128K под логи),
# Incus только монтирует его в инстанс. Тома внутри пула Incus не создаём:
# у zfs-драйвера нет ключа `source`, подключить чужой датасет томом нельзя.
name: vl1
description: "VictoriaLogs (victorialogs-loc): приём и хранение логов"

config:
  # --- ресурсы ---
  limits.cpu: "2"
  limits.memory: 2GiB

  # --- политика для хостового контура (см. «актуальная схема.md» в lxc-build) ---
  user.role: victorialogs
  user.package: victorialogs-loc
  user.update_policy: inplace          # логи сохраняем, меняются версии пакетов
  user.rollback_window: 24h            # сколько живут снапшоты после обновления
  user.boot_marker: /run/lxc-boot-ok
  user.healthcheck: "curl -fsS --max-time 5 http://127.0.0.1:9428/health >/dev/null && systemctl is-active --quiet victorialogs-loc"
  user.data_dataset: tank/vl-data
  user.data_mountpoint: /var/lib/victorialogs-loc
  user.service_uid: "479"

  # uid сервиса внутри нужен, чтобы хостовая сторона была предсказуемой: владельцем датасета
  # на хосте должен быть 100000+uid, и это число контур вычисляет сам из карты инстанса
  # (services/README.md, «Правило id-маппинга»). Пара `raw.idmap` НЕ нужна — дефолтный
  # маппинг контейнера уже переводит uid 479 в 100479, достаточно правильного владельца.
  # root внутри контейнера при этом остаётся 100000 на хосте, не 0.
  # (ключ raw.idmap сознательно отсутствует — см. выше)

  cloud-init.user-data: |
    #cloud-config
    # Сеть и имя держат образ (systemd-networkd + шаблон hostname) — задано в
    # /etc/cloud/cloud.cfg.d/99-lxc.cfg базового образа, здесь не повторяется.
    write_files:
      - path: /etc/zypp/repos.d/zypper-sle-alexrus1234.repo
        permissions: '0644'
        content: |
          [zypper-sle-alexrus1234]
          name=zypper-sle-alexrus1234 (личный rpm-md, Хражевник)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/repo/zypper-sle-alexrus1234
          enabled=1
          autorefresh=0
          type=rpm-md
          gpgcheck=0
    runcmd:
      - |
        set -euo pipefail
        # 1. uid сервиса фиксируем САМИ до установки пакета: пакет создаёт пользователя
        #    без номера (`u victorialogs-loc - ...`), и sysusers выделил бы первый свободный.
        #    Пара raw.idmap в декларации требует известного номера, поэтому объявляем его
        #    явно — тем же форматом, что и «правильный» фикс в пакете. systemd-sysusers
        #    есть всегда: systemd в базовом образе.
        cat > /etc/sysusers.d/00-lxc-pin.conf <<'CONF'
        u victorialogs-loc 479 "VictoriaLogs single-node (uid закреплён декларацией)" /var/lib/victorialogs-loc /usr/bin/nologin
        CONF
        systemd-sysusers /etc/sysusers.d/00-lxc-pin.conf
        id -u victorialogs-loc | grep -qx 479          # номер занят внутри — падаем громко
        # 2. Доверие к Хражевнику и зеркало foundation лежат в образе — проверяем, а не надеемся.
        test -f /etc/pki/trust/anchors/step-ca.crt
        update-ca-certificates >/dev/null
        test -f /etc/zypp/repos.d/khrazhevnik-leap16-oss.repo
        # 3. Апстримных репозиториев в пути быть не должно.
        if ls /etc/zypp/repos.d/openSUSE*.repo >/dev/null 2>&1; then
          echo "в образе апстримный репозиторий — путь нарушен"; exit 1
        fi
        # 4. Сервис ставится из личного rpm-md.
        zypper --non-interactive --gpg-auto-import-keys refresh
        zypper --non-interactive install -y --no-recommends victorialogs-loc
        systemctl enable --now victorialogs-loc
        # 5. Владелец примонтированного датасета: tmpfiles.d пакета выставляет его по имени,
        #    и через пару 1:1 он виден внутри как 479. Проверяем — иначе сервис не сможет писать.
        test "$(stat -c %u /var/lib/victorialogs-loc)" = 479
        # 6. Критерий успеха — живой сервис, а не «cloud-init done»: при недоступном
        #    репозитории статус тоже done, а пакета нет (замерено).
        ok=0
        for i in $(seq 1 30); do
          if curl -fsS --max-time 3 http://127.0.0.1:9428/health >/dev/null 2>&1; then ok=1; break; fi
          sleep 2
        done
        if [ "$ok" != 1 ]; then
          echo "victorialogs-loc не отвечает на /health"
          journalctl -u victorialogs-loc -n 50 --no-pager || true
          exit 1
        fi
        echo "vl1: victorialogs-loc поднят и отвечает (uid $(id -u victorialogs-loc))"

devices:
  # Данные — датасет хоста (не том внутри пула Incus): снапшоты и откат делает контур
  # через zfs snapshot/rollback по user.data_dataset.
  data:
    type: disk
    source: /tank/vl-data
    path: /var/lib/victorialogs-loc
