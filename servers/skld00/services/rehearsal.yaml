# ВРЕМЕННАЯ декларация для репетиции контура (2026-10-13). Удалить после проверки.
#
# Зачем: живьём проверить две ветки, которые в бою ещё не срабатывали —
#   (1) откат при провале пересоздания (вернуть стоянку + zfs rollback),
#   (2) снятие инстанса по удалённой из git декларации.
# Сеть: собственных плеч нет — инстанс живёт на служебном бридже Incus (его даёт профиль
# `default`), поэтому в LAN и на линке он ничего не занимает и никому не мешает.
# Данные: отдельный датасет tank/rehearsal-data — чтобы заодно проверить снапшот/откат данных.
name: rehearsal
description: "Репетиция контура: откат пересоздания и снятие (временный инстанс)"

config:
  limits.cpu: "1"
  limits.memory: 512MiB

  user.managed-by: homelab-deploy/skld00
  user.role: rehearsal
  user.package: victorialogs-loc
  user.update_policy: inplace
  user.rollback_window: 1h
  user.boot_marker: /run/lxc-boot-ok
  user.healthcheck: "curl -fsS --max-time 5 http://127.0.0.1:9428/health >/dev/null && systemctl is-active --quiet victorialogs-loc"
  user.data_dataset: tank/rehearsal-data
  user.data_mountpoint: /var/lib/victorialogs-loc

  cloud-init.user-data: |
    #cloud-config
    write_files:
      - path: /etc/zypp/repos.d/zypper-sle-alexrus1234.repo
        permissions: '0644'
        content: |
          [zypper-sle-alexrus1234]
          name=zypper-sle-alexrus1234 (личный rpm-md, Хражевник)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/repo/zypper-sle-alexrus1234
          enabled=1
          autorefresh=0
          type=rpm-md
          gpgcheck=0
      # ШАГ 2 РЕПЕТИЦИИ (2026-10-13): намеренно ломаем сервис — проба не пройдёт, и контур
      # обязан откатить пересоздание. Уходит вместе с временной декларацией.
      - path: /etc/systemd/system/victorialogs-loc.service.d/zz-rehearsal-break.conf
        permissions: '0644'
        content: |
          # Репетиция: сервис стартует и сразу падает — юнит «поднялся», но unhealthy.
          [Service]
          ExecStart=
          ExecStart=/bin/false
    runcmd:
      - |
        set -euo pipefail
        # Ждём адрес на eth0 (его выдаёт служебный бридж Incus) — без него не дойти до репозитория.
        for i in $(seq 1 20); do
          ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' && break
          sleep 2
        done
        ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' \
          || { echo "eth0: адрес не пришёл за 40 с"; exit 1; }
        test -f /etc/pki/trust/anchors/step-ca.crt
        update-ca-certificates >/dev/null
        if ls /etc/zypp/repos.d/openSUSE*.repo >/dev/null 2>&1; then
          echo "в образе апстримный репозиторий — путь нарушен"; exit 1
        fi
        zypper --non-interactive --gpg-auto-import-keys refresh
        zypper --non-interactive install -y --no-recommends victorialogs-loc
        rpm -q victorialogs-loc >/dev/null
        systemctl enable victorialogs-loc.service >/dev/null
        systemctl daemon-reload
        echo "rehearsal: пакет установлен, юнит включён (uid $(id -u victorialogs-loc))"

devices:
  # Сетевых устройств нет намеренно: профиль `default` даёт eth0 на служебном бридже.
  data:
    type: disk
    source: /tank/rehearsal-data
    path: /var/lib/victorialogs-loc
