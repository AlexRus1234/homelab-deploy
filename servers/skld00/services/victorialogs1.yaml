# Декларация инстанса VictoriaLogs (victorialogs1) на skld00.
#
# Подаётся напрямую:  incus-loc launch leap16-base victorialogs1 < этот файл
# и разбирается хостовым контуром: servers/skld00/reconcile.sh
#
# Раскладка: базовый образ — артефакт со склада (`leap16-base`, живёт на tank/incus),
# данные — заранее созданный датасет `tank/vl-data` (recordsize=128K под логи),
# Incus только монтирует его в инстанс. Тома внутри пула Incus не создаём:
# у zfs-драйвера нет ключа `source`, подключить чужой датасет томом нельзя.
#
# Сеть (замерено на живом Incus 2026-10-13): три плеча — два macvlan на физических картах
# узла и приватный бридж Incus под наблюдаемость.
#   eth0 — LAN. Адрес приходит по DHCP от роутера: имя `eth0` подхватывает запёкшийся в
#          базе /etc/systemd/network/eth0.network (DHCP=ipv4 + ClientIdentifier=mac),
#          поэтому сетевых файлов для LAN в декларации нет. MAC объявлен константой:
#          адрес задаётся резервацией на роутере (MAC → 172.20.50.101) и переживает
#          пересоздание инстанса. Профильное `eth0` (бридж incusbr0) перебито одноимённым
#          устройством инстанса — внутренней сети у сервиса больше нет.
#   eth1 — прямой линк skld00↔yadr01 (карта enp8s0, пир 172.21.6.250). Адрес — статикой
#          из файла в user-data, без шлюза: DHCP-сервера на линке нет. Последний байт адреса —
#          тот же, что в LAN (`172.20.50.101` ↔ `172.21.6.101`): у сервиса одна схема адресации.
#   eth2 — приватная сеть узла `observ0` (`172.26.50.0/24`, DHCP выключен, NAT выключен,
#          из LAN не маршрутизируется; см. 01_архитектура_и_сеть.md). Нужна для служебного
#          трафика: узел собирает свои метрики и логи и отдаёт их инстансам, не выставляя
#          сборщики в LAN. Адрес — статикой, без шлюза, последний байт по той же схеме
#          (`172.26.50.101`). Сам узел виден в этой сети как `172.26.50.1` — адрес бриджа,
#          на него смотрят экспортёры узла.
# macvlan-линк Incus создаёт внутри сетевого неймспейса инстанса — на хосте своего
# интерфейса он не заводит, поэтому хостовые `mv-*` и чужие сети не задеваются.
name: victorialogs1
description: "VictoriaLogs (victorialogs-loc): приём и хранение логов"

config:
  # --- ресурсы ---
  limits.cpu: "2"
  limits.memory: 2GiB

  # --- политика для хостового контура (см. «актуальная схема.md» в lxc-build) ---
  user.managed-by: homelab-deploy/skld00     # маркер: без него контур инстанс не трогает и не снимает
  user.role: victorialogs
  user.package: victorialogs-loc
  user.update_policy: inplace          # логи сохраняем, меняются версии пакетов
  user.rollback_window: 24h            # сколько живут снапшоты после обновления
  user.boot_marker: /run/lxc-boot-ok
  user.healthcheck: "curl -fsS --max-time 5 http://127.0.0.1:9428/health >/dev/null && systemctl is-active --quiet victorialogs-loc"
  user.data_dataset: tank/vl-data
  user.data_mountpoint: /var/lib/victorialogs-loc

  # uid сервиса НЕ объявляется: номер, который выдал пакет, контур читает из инстанса
  # (`id -u victorialogs-loc`) и от него считает хозяина данных на хосте (100000+uid).
  # Объявлять номер нельзя — пакет создаёт пользователя через sysusers.d без номера,
  # и замерено: запрошенный 479 был занят, система выдала 478.

  cloud-init.user-data: |
    #cloud-config
    # Имя инстанса держит образ (шаблон hostname) — задано в /etc/cloud/cloud.cfg.d/99-lxc.cfg
    # базового образа, здесь не повторяется. Для LAN-плеча сетевого файла тоже нет: имя
    # `eth0` подхватывает запёкшийся eth0.network с DHCP. Здесь — только линк.
    write_files:
      - path: /etc/zypp/repos.d/zypper-sle-alexrus1234.repo
        permissions: '0644'
        content: |
          [zypper-sle-alexrus1234]
          name=zypper-sle-alexrus1234 (личный rpm-md, Хражевник)
          baseurl=https://khrazhevnik.panelka.yadr01.internal/repo/zypper-sle-alexrus1234
          enabled=1
          autorefresh=0
          type=rpm-md
          gpgcheck=0
      - path: /etc/systemd/network/20-eth1.network
        permissions: '0644'
        content: |
          # Прямой линк skld00 <-> yadr01: адрес статикой, шлюза нет (пир 172.21.6.250 на линке же).
          [Match]
          Name=eth1

          [Network]
          Address=172.21.6.101/24
      - path: /etc/systemd/network/21-eth2.network
        permissions: '0644'
        content: |
          # Приватная сеть узла observ0: служебный трафик наблюдаемости. Шлюза нет намеренно —
          # маршрут по умолчанию у сервиса один и он принадлежит LAN-плечу.
          [Match]
          Name=eth2

          [Network]
          Address=172.26.50.101/24
    runcmd:
      - |
        set -euo pipefail
        # Сеть: LAN-плечо поднимается само (DHCP по запёкшемуся файлу образа), линк — статикой.
        # Ждём LAN-адрес ограниченно: без него не дойти до Хражевника, и молча ставить пакет
        # «в пустоту» нельзя — лучше явная ошибка, её увидит контур.
        for i in $(seq 1 20); do
          ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' && break
          sleep 2
        done
        ip -4 -o addr show dev eth0 2>/dev/null | grep -q ' inet ' \
          || { echo "LAN (eth0): адрес по DHCP не пришёл за 40 с"; exit 1; }
        networkctl reload >/dev/null 2>&1 || true
        networkctl reconfigure eth1 >/dev/null 2>&1 || true
        ip -4 -o addr show dev eth1 2>/dev/null | grep -q '172\.21\.6\.101' \
          || { echo "линк (eth1): адрес 172.21.6.101 не поднялся"; exit 1; }
        networkctl reconfigure eth2 >/dev/null 2>&1 || true
        ip -4 -o addr show dev eth2 2>/dev/null | grep -q '172\.26\.50\.101' \
          || { echo "приватная сеть (eth2): адрес 172.26.50.101 не поднялся"; exit 1; }
        # Задача user-data — только поставить пакет и включить юнит. Запуск сервиса
        # делает хостовый контур ПОСЛЕ того, как выставит владельца датасета: внутри
        # контейнера chown примонтированного датасета невозможен (он принадлежит
        # неназначенному uid, прав на него у root'а контейнера нет).
        # uid сервиса здесь НЕ фиксируется: номер читает контур из инстанса после
        # установки (пакет создаёт пользователя сам, номер от нас не зависит).
        test -f /etc/pki/trust/anchors/step-ca.crt
        update-ca-certificates >/dev/null
        test -f /etc/zypp/repos.d/khrazhevnik-leap16-oss.repo
        if ls /etc/zypp/repos.d/openSUSE*.repo >/dev/null 2>&1; then
          echo "в образе апстримный репозиторий — путь нарушен"; exit 1
        fi
        zypper --non-interactive --gpg-auto-import-keys refresh
        zypper --non-interactive install -y --no-recommends victorialogs-loc
        rpm -q victorialogs-loc >/dev/null
        systemctl enable victorialogs-loc.service >/dev/null
        echo "victorialogs1: сеть поднята ($(ip -4 -o addr show dev eth0 | awk '{print $4}' | head -1) / $(ip -4 -o addr show dev eth1 | awk '{print $4}' | head -1) / $(ip -4 -o addr show dev eth2 | awk '{print $4}' | head -1)), пакет установлен, юнит включён (uid $(id -u victorialogs-loc))"

devices:
  # LAN-плечо: macvlan на физической карте узла. Имя `eth0` и здесь, и внутри — так
  # одноимённое устройство инстанса перебивает профильное (бридж incusbr0), а гость
  # подхватывает запёкшийся DHCP-файл образа. Адрес в декларации не задаётся: macvlan
  # его не принимает (`Invalid device option "ipv4.address"`, замерено), по DHCP он и
  # не нужен — резервация на роутере привязывается к MAC ниже.
  eth0:
    type: nic
    nictype: macvlan
    parent: enp7s0
    name: eth0
    hwaddr: "02:76:6c:00:00:01"
  # Линк до yadr01: та же механика на второй карте, адрес — статикой из user-data.
  eth1:
    type: nic
    nictype: macvlan
    parent: enp8s0
    name: eth1
    hwaddr: "02:76:6c:01:00:01"
  # Приватная сеть узла (бридж Incus `observ0`, управляется Incus, а не профилем):
  # DHCP и NAT выключены, из LAN не маршрутизируется, поэтому служебный трафик
  # (метрики, логи) идёт здесь и наружу не виден. Адрес ставится файлом в user-data:
  # шлюза на этом плече нет, маршрут по умолчанию остаётся у LAN.
  eth2:
    type: nic
    network: observ0
    name: eth2
    hwaddr: "02:76:6c:02:00:01"
  # Данные — датасет хоста (не том внутри пула Incus): снапшоты и откат делает контур
  # через zfs snapshot/rollback по user.data_dataset.
  data:
    type: disk
    source: /tank/vl-data
    path: /var/lib/victorialogs-loc
