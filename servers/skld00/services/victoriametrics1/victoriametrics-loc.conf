# Аргументы victoriametrics-loc (читает юнит victoriametrics-loc.service).
#
# Приём метрик — pull: перечень источников лежит рядом, в scrape.yml, и подхватывается
# только при старте юнита (поэтому контур после раскладки конфига делает restart).
ARGS="-promscrape.config=/etc/victoriametrics-loc/scrape.yml"
