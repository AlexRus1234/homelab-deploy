# Аргументы запуска smartctl_exporter-loc (читает юнит smartctl_exporter-loc.service).
#
# listen-address — адрес бриджа observ0 (видят только инстансы сегмента).
# Умолчания не трогаем: экспортёр сам сканирует диски узла и берёт /usr/sbin/smartctl.
# Если скан не находит диск — перечислить явно: --smartctl.device=/dev/sdX (список даёт
# `sudo smartctl --scan`).
#
# Юнит работает только на железе: у него ConditionVirtualization=false, в контейнере и ВМ
# он не запускается (SMART берётся с реальных устройств).
SMARTCTL_EXPORTER_ARGS="--web.listen-address=172.26.50.1:9633"
