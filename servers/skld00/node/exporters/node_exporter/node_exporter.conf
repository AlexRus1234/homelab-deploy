# Аргументы запуска node_exporter-loc (читает юнит node_exporter-loc.service).
#
# listen-address — адрес бриджа observ0: его видят только инстансы сегмента (victoriametrics1
# забирает отсюда метрики). 0.0.0.0 тут стоять не должен — иначе источники видны из LAN.
#
# textfile.directory — сюда контур пишет свои метрики (update.sh → lxc.prom):
# lxc_instance_health, lxc_last_update_success_timestamp, счётчики уборки снапшотов.
#
# Коллектор zfs у node_exporter включён по умолчанию (нужен /proc/spl/kstat/zfs на узле),
# отдельного флага не требует.
NODE_EXPORTER_ARGS="--web.listen-address=172.26.50.1:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
