# Аргументы запуска zfs_exporter-loc (читает юнит zfs_exporter-loc.service).
#
# listen-address — адрес бриджа observ0 (видят только инстансы сегмента).
# Пулы экспортёр перечисляет сам через `zpool`, поэтому --pool нужен только чтобы
# ограничить набор: --pool=tank. Коллекторы по умолчанию: pool, dataset-filesystem,
# dataset-volume; снапшоты можно выключить (--no-collector.dataset-snapshot).
#
# Зависит от пакета zfs-utils (ходит в zfs/zpool через CLI, с libzfs не линкуется).
ZFS_EXPORTER_ARGS="--web.listen-address=172.26.50.1:9134"
