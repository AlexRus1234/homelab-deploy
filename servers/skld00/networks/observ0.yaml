# Декларация сети (бриджа) узла skld00 — приватный сегмент под служебный трафик наблюдаемости.
#
# Разбирается хостовым контуром: servers/skld00/reconcile.sh (ветка «сети»).
# Порядок применения: сети приводятся ДО инстансов. Если такая сеть нужна устройству
# инстанса (`eth2` в services/*.yaml), она уже существует к моменту create — иначе create
# падал бы внутри пересоздания, уже отставив рабочую стоянку в сторону.
#
# Почему именно так:
#   * сегмент должен быть недостижим из основной сети (`172.20.0.0/16`) — поэтому без DHCP
#     (никаких аренд и dnsmasq) и без NAT (наружу через него не ходим: у инстансов есть LAN);
#   * адреса внутри ставит декларация инстанса статикой, без шлюза: маршрут по умолчанию
#     у сервиса один и принадлежит LAN-плечу;
#   * удаление сетей контуром НЕ выполняется автоматически: снос бриджа с живыми инстансами
#     роняет их молча. Сеть без декларации — строка в отчёте, снимается руками.
#
# Схема адресации `172.26.0.0/16` — локальные сети узлов, см. docs/Инфраструктура/01_архитектура_и_сеть.md.
name: observ0
description: "Приватная сеть узла: служебный трафик наблюдаемости (метрики и логи инстансов)"
type: bridge

config:
  ipv4.address: 172.26.50.1/24     # адрес узла в этом сегменте: на него смотрят сборщики метрик
  ipv4.dhcp: "false"               # статика по декларациям инстансов; аренд и dnsmasq нет
  ipv4.nat: "false"                # наружу через сегмент не ходим
  ipv6.address: "none"             # второе семейство адресов тут не нужно
