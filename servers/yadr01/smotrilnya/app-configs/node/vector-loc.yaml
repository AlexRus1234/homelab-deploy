# Vector на smotrilnya: журнал ВМ → VictoriaLogs на SKLD00 (инстанс victorialogs1).
#
# Отличие от конфига SKLD00 ровно в адресе приёмника: там приватный сегмент
# 172.26.50.101, здесь — LAN-адрес 172.20.50.101 (у этой ВМ плеча в observ0 нет).
# data_dir — с суффиксом -loc: иначе Vector пишет состояние в /var/lib/vector
# (каталог upstream-пакета, которого у нас нет).
data_dir: "/var/lib/vector-loc"

sources:
  journald:
    type: journald
    # Позицию держит чекпойнт в data_dir, поэтому журнал не перечитывается с начала.
    current_boot_only: false

transforms:
  # systemd отдаёт _SYSTEMD_UNIT, а Vector — SYSLOG_IDENTIFIER: без этой
  # трансформации стрим в VictoriaLogs получится только по хосту.
  normalize:
    type: remap
    inputs: ["journald"]
    source: |
      .unit = .SYSLOG_IDENTIFIER

sinks:
  victorialogs:
    type: elasticsearch
    inputs: ["normalize"]
    endpoints: ["http://172.20.50.101:9428/insert/elasticsearch/"]
    api_version: "v8"
    mode: bulk
    # VictoriaLogs не отвечает на Elasticsearch health-check — иначе Vector
    # будет считать приёмник недоступным и не запустит поток.
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: "host,unit"
