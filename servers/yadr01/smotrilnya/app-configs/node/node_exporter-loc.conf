# Аргументы node_exporter-loc на smotrilnya (пакет из своего rpm-md).
#
# Слушаем ВСЕ интерфейсы сознательно: vmagent работает в rootless-контейнере
# (bridge 10.89.0.0/24) и обращается к хосту по спец-адресу host.containers.internal
# = 169.254.1.2, а не по LAN-адресу ВМ. Привязка `--web.listen-address=172.20.6.13:9100`
# делает экспортёр невидимым для контейнера («connection refused»).
# Шире, чем нужно, не выставляем: порт слушает только сам экспортёр метрик, без записи.
NODE_EXPORTER_ARGS="--web.listen-address=:9100"
