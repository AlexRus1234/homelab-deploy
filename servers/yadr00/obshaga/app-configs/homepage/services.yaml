# Карточки сервисов. Документация: https://gethomepage.dev/configs/services/
#
# homepage читает РОВНО ОДИН services.yaml (split на каталоги версией 2.4.0 не
# поддерживается — servicesFromConfig в исходниках). Разделение конфигурации —
# по файлам самого homepage: settings / services / bookmarks / widgets / proxmox / docker.
#
# Иконки: *.png — dashboard-icons; имя без расширения — Lucide (квадратные, маленькие).
# proxmoxNode — ключ из proxmox.yaml (имя ноды PVE, РЕГИСТР ВАЖЕН: YADR00 ≠ yadr00).

# ============================ ИНФРАСТРУКТУРА ============================

- Инфраструктура:
    - Proxmox VE (yadr00):
        icon: proxmox.png
        href: https://proxmox.yadr00.internal
        description: Гипервизор #1 — N100, 32 ГБ
        widget:
          type: proxmox
          url: https://172.20.5.1:8006
          username: homepage@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET_YADR00}}"
          node: YADR00
    - Proxmox VE (yadr01):
        icon: proxmox.png
        href: https://proxmox.yadr01.internal
        description: Гипервизор #2 — Ryzen 7 5800HS, 64 ГБ
        widget:
          type: proxmox
          url: https://172.20.6.1:8006
          username: homepage@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET_YADR01}}"
          node: yadr01
    - PBS:
        icon: proxmox.png
        href: https://pbs.yadr01.internal
        description: Proxmox Backup Server — LXC 101
        proxmoxNode: yadr01
        proxmoxVMID: 101
        proxmoxType: lxc
    - Forgejo:
        icon: forgejo.png
        href: https://git.yadr00.internal
        description: Git-сервер + реестр образов и пакетов — LXC 100
        proxmoxNode: YADR00
        proxmoxVMID: 100
        proxmoxType: lxc
        # репозитории / уведомления / issues / PR (scopes: repository, issue, notifications)
        widget:
          type: gitea
          url: http://172.20.5.2:3000
          key: "{{HOMEPAGE_VAR_FORGEJO_TOKEN}}"
    - Authentik:
        icon: authentik.png
        href: https://authentic.yadr00.internal
        description: SSO-провайдер — VM 102
        proxmoxNode: YADR00
        proxmoxVMID: 102
    - Forgejo Runner:
        icon: git-branch
        href: https://git.yadr00.internal/AlexRus1234/homelab-deploy/actions
        description: gitrunner (yadr01) — последние задачи Actions
        # proxmoxNode: yadr01
        # proxmoxVMID: TODO VMID ВМ gitrunner (по паспорту YADR01 — VM 106)
        # Ответ Forgejo: {"workflow_runs": [{name, status, run_number, ...}]}
        widget:
          type: customapi
          url: http://172.20.5.2:3000/api/v1/repos/AlexRus1234/homelab-deploy/actions/tasks
          headers:
            Authorization: token {{HOMEPAGE_VAR_FORGEJO_TOKEN}}
          display: dynamic-list
          refreshInterval: 30000
          mappings:
            items: workflow_runs
            name: name
            label: status
            limit: 5
            target: https://git.yadr00.internal/AlexRus1234/homelab-deploy/actions/runs/{run_number}

# ============================== ПРИЛОЖЕНИЯ ==============================

- Приложения:
    - Memos:
        icon: memos.png
        href: https://memos.obshaga.yadr00.internal
        description: Заметки — порт 10004
        server: obshaga
        container: memos
    - LinkStack:
        icon: linkstack.png
        href: https://linkstack.obshaga.yadr00.internal
        description: Мультиссылки — порт 10003
        server: obshaga
        container: systemd-03-linkstack
    - Element:
        icon: element.png
        href: https://element.obshaga.yadr00.internal
        description: Matrix-клиент — порт 10001
        server: obshaga
        container: element
    - NORA:
        icon: package
        href: https://nora.panelka.yadr01.internal
        description: Artifact Registry (npm/go/oci) — порт 10001
        # proxmoxNode: yadr01
        # proxmoxVMID: TODO VMID ВМ panelka
    - Khrazhevnik:
        icon: hard-drive-download
        href: https://khrazhevnik.panelka.yadr01.internal
        description: Зеркало linux-репозиториев — порт 10002
        # Статистика кеша из админ-API (:10003 → :30202, Bearer khz_-токен scope admin)
        widget:
          type: customapi
          url: http://172.20.6.9:10003/api/v1/cache/stats
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_KHRZ_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: hit_ratio
              label: Hit ratio
              format: percent
            - field: packages
              label: Пакетов в кеше
              format: number
            - field: bytes_to_clients
              label: Отдано клиентам
              format: bytes
            - field: upstream_errors
              label: Ошибок upstream
    - Khrazhevnik (раздачи):
        icon: history
        href: https://khrazhevnik.panelka.yadr01.internal
        description: Последние 10 клиентских раздач кеша (HIT/MISS/STALE)
        widget:
          type: customapi
          url: http://172.20.6.9:10003/api/v1/cache/transactions?limit=10
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_KHRZ_TOKEN}}
          display: dynamic-list
          refreshInterval: 15000
          mappings:
            # ответ — голый массив в корне, items не указываем
            name: path
            label: status
            limit: 10
            target: https://khrazhevnik.panelka.yadr01.internal/{path}
    - Khrazhevnik (админка):
        icon: gauge
        href: http://172.20.6.9:10003/ui/dashboard
        description: Веб-панель управления зеркалом и кешем
        siteMonitor: http://172.20.6.9:10003/healthz
    - SFTPGo:
        icon: lock
        href: https://sftpgo.yadr01.internal
        description: Файловое облако — LXC 106
        proxmoxNode: yadr01
        proxmoxVMID: 106
        proxmoxType: lxc

