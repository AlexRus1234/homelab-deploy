# Карточки сервисов. Документация: https://gethomepage.dev/configs/services/
#
# proxmoxNode — ключ из proxmox.yaml (имя ноды PVE), proxmoxVMID — гостя из PVE.
# Строки с "TODO" раскомментировать и заполнить реальными VMID.

- Инфраструктура:
    - Proxmox VE (yadr00):
        icon: proxmox.png
        href: https://proxmox.yadr00.internal
        description: Гипервизор #1 — N100, 32 ГБ
        # node: должно совпадать с hostname ноды PVE и ключом в proxmox.yaml
        widget:
          type: proxmox
          url: https://172.20.5.1:8006
          username: homepage@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET_YADR00}}"
          node: YADR00
    - Proxmox VE (yadr01):
        icon: proxmox.png
        href: https://proxmox.yadr01.internal
        description: Гипервизор #2 — Ryzen 7 5800HS, 64 ГБ
        widget:
          type: proxmox
          url: https://172.20.6.1:8006
          username: homepage@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET_YADR01}}"
          node: yadr01
    - PBS:
        icon: proxmox.png
        href: https://pbs.yadr01.internal
        description: Proxmox Backup Server — LXC 101
        proxmoxNode: yadr01
        proxmoxVMID: 101
        proxmoxType: lxc
    - Forgejo:
        icon: forgejo.png
        href: https://git.yadr00.internal
        description: Git-сервер + реестр образов и пакетов — LXC 108
        proxmoxNode: YADR00
        proxmoxVMID: 108
        proxmoxType: lxc
        # репозитории / уведомления / issues / PR (токен scopes: repository, issue, notifications)
        widget:
          type: gitea
          url: http://172.20.5.2:3000
          key: "{{HOMEPAGE_VAR_FORGEJO_TOKEN}}"
    - Authentik:
        icon: authentik.png
        href: https://authentic.yadr00.internal
        description: SSO-провайдер — VM 102
        proxmoxNode: YADR00
        proxmoxVMID: 102
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://alpine-vaultwarden.yadr00.internal
        description: Менеджер паролей
        # proxmoxNode: YADR00
        # proxmoxVMID: TODO VMID LXC Vaultwarden
        # proxmoxType: lxc
    - Forgejo Runner:
        abbr: CI
        href: https://git.yadr00.internal/AlexRus1234/homelab-deploy/actions
        description: ВМ gitrunner (yadr01) — последние задачи Actions репо homelab-deploy
        # proxmoxNode: yadr01
        # proxmoxVMID: TODO VMID ВМ gitrunner (по паспорту YADR01 — VM 106)
        # Последние задачи CI: dynamic-list (имя задачи + статус), клик — на run в Forgejo
        widget:
          type: customapi
          url: http://172.20.5.2:3000/api/v1/repos/AlexRus1234/homelab-deploy/actions/tasks
          headers:
            Authorization: token {{HOMEPAGE_VAR_FORGEJO_TOKEN}}
          display: dynamic-list
          refreshInterval: 30000
          mappings:
            items: entries
            name: name
            label: status
            limit: 5
            target: https://git.yadr00.internal/AlexRus1234/homelab-deploy/actions/runs/{run_id}

