name: Зеркалирование homelab-deploy

# Срабатывает при каждом пуше в основную ветку
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  sync-mirrors:
    runs-on: docker
    container:
      # Используем сверхлегкий контейнер с Git
      image: docker.io/alpine/git:latest

    steps:
      - name: Настройка безопасности и клонирование
        run: |
          echo "=== Загружаем корневой сертификат нашего CA (Step-CA) ==="
          # Качаем публичный ключ доверия с нашего роутера
          wget --no-check-certificate https://172.20.0.1:9000/roots.pem -O /tmp/step-ca.crt

          echo "=== Настраиваем Git на доверие к нашей локальной сети ==="
          # Говорим Git проверять HTTPS-соединения по нашему сертификату
          git config --global http.sslCAInfo /tmp/step-ca.crt

          echo "=== Скачиваем код с домашнего сервера ==="
          # Клонируем репозиторий в текущую папку (точка в конце обязательна)
          git clone ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git .
          echo "=== Возвращаем стандартные сертификаты для остального интернета! ==="
          git config --global --unset http.sslCAInfo

      - name: Обозначение зеркала в README
        run: |
          echo "Добавление отметки о зеркале в README..."
          printf '%s\n' '> **Это зеркало репозитория. Оригинал находится по адресу:**' '> [https://git.alexrus1234.ru/AlexRus1234/homelab-deploy](https://git.alexrus1234.ru/AlexRus1234/homelab-deploy)' '' > /tmp/mirror-notice-ru
          cat /tmp/mirror-notice-ru README.md > README.md.tmp && mv README.md.tmp README.md
          git config user.name "Forgejo mirror"
          git config user.email "forgejo-mirror@localhost"
          git add README.md
          git commit -m "docs: mark repository as a mirror"

      - name: Отправка на GitHub
        continue-on-error: true
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "Синхронизация с GitHub..."
          case "$GITHUB_REF" in
            refs/heads/*) git push --force https://AlexRus1234:${TOKEN_GITHUB}@github.com/AlexRus1234/homelab-deploy.git HEAD:main ;;
          esac
          git push https://AlexRus1234:${TOKEN_GITHUB}@github.com/AlexRus1234/homelab-deploy.git --tags

      - name: Отправка на Mos.Hub
        continue-on-error: true
        env:
          TOKEN_MOSHUB: ${{ secrets.TOKEN_MOSHUB }}
        run: |
          echo "Синхронизация с Mos.Hub..."
          case "$GITHUB_REF" in
            refs/heads/*) git -c http.sslVerify=false push --force https://AlexRUS1234:${TOKEN_MOSHUB}@hub.mos.ru/AlexRUS1234/homelab-deploy.git HEAD:main ;;
          esac
          git -c http.sslVerify=false push https://AlexRUS1234:${TOKEN_MOSHUB}@hub.mos.ru/AlexRUS1234/homelab-deploy.git --tags

      - name: Отправка на Codeberg
        continue-on-error: true
        env:
          TOKEN_CODEBERG: ${{ secrets.TOKEN_CODEBERG }}
        run: |
          echo "Синхронизация с Codeberg..."
          case "$GITHUB_REF" in
            refs/heads/*) git push --force https://AlexRus1234:${TOKEN_CODEBERG}@codeberg.org/AlexRus1234/homelab-deploy.git HEAD:main ;;
          esac
          git push https://AlexRus1234:${TOKEN_CODEBERG}@codeberg.org/AlexRus1234/homelab-deploy.git --tags
