<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>AlexRus1234</title>
<meta name="description" content="Ссылки проекта AlexRus1234">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230369a1'/></svg>">
<style>
  :root{
    --bg:#0f1115; --card:#15181e; --card-hover:#1a1e26;
    --border:#242a33; --border-hi:#3a4351;
    --fg:#e6e9ef; --muted:#8b95a5;
    --radius:10px; --maxw:1180px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#ffffff; --card:#fbfcfd; --card-hover:#f4f6f9;
      --border:#e4e8ee; --border-hi:#c7ced8;
      --fg:#111418; --muted:#5b6676;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:36px 20px 48px}

  header{margin-bottom:18px}
  h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}

  .search{margin:16px 0 26px;max-width:420px}
  .search input{
    width:100%;padding:10px 14px;border-radius:8px;color:var(--fg);font-size:14px;
    background:var(--card);border:1px solid var(--border);outline:none;
    transition:border-color .15s
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--border-hi)}

  section{margin-bottom:24px}
  h2{margin:0 0 3px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
  .note{margin:0 0 10px;color:var(--muted);font-size:12.5px}

  /* одна группа — одна строка: колонок столько, сколько ссылок в группе */
  .grid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
  @media (max-width:1040px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  }

  .card{
    display:flex;flex-direction:column;gap:3px;padding:12px 14px;
    text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius);
    transition:border-color .15s, background .15s
  }
  .card:hover{border-color:var(--border-hi);background:var(--card-hover)}
  .card:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  .t{font-weight:600;font-size:14.5px}
  .d{color:var(--muted);font-size:13px}

  /* та же ссылка, но строкой для копирования: клик копирует, а не открывает */
  .url{
    margin-top:9px;padding-top:9px;border-top:1px solid var(--border);
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    word-break:break-all;cursor:copy
  }
  .url:hover{color:var(--fg)}
  .card[data-copy="1"]{cursor:copy}

  .count{color:var(--muted);font-size:12.5px;margin-top:16px}
  .empty{color:var(--muted);padding:10px 0}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);
    background:var(--fg);color:var(--bg);border-radius:8px;
    padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .15s, transform .15s
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="wrap">
  <header><h1 id="title">Загрузка…</h1></header>

  <div class="search">
    <input id="q" type="search" placeholder="Фильтр: имя, описание, группа" autocomplete="off" aria-label="Фильтр ссылок">
  </div>

  <div id="out"><p class="empty">Читаю links.json…</p></div>
  <div class="count" id="count"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(async function () {
  const out = document.getElementById('out');
  const toast = document.getElementById('toast');
  let data;

  try {
    const r = await fetch('links.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    out.innerHTML = '<p class="empty">Не удалось прочитать <b>links.json</b> (' + e.message +
      '). Файл отдаётся тем же сервером, поэтому страница должна открываться по http(s), а не как file://</p>';
    return;
  }

  const site = data.site || {};
  const groups = (data.groups || []).map(g => ({
    name: g.name || '', note: g.note || '', links: g.links || []
  }));
  const all = groups.flatMap(g => g.links);

  document.title = site.title || document.title;
  document.getElementById('title').textContent = site.title || '';
  const totalText = all.length + ' ' + plural(all.length, 'ссылка', 'ссылки', 'ссылок');
  document.getElementById('count').textContent = totalText;
  out.innerHTML = '';

  // рендер: одна группа — одна строка карточек
  groups.forEach(g => {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = g.name; sec.appendChild(h);
    if (g.note) { const n = document.createElement('p'); n.className = 'note'; n.textContent = g.note; sec.appendChild(n); }

    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.setProperty('--cols', Math.max(1, g.links.length));

    g.links.forEach(l => {
      const copyOnly = l.copy === true;          // карточка-ссылка для копирования, не для перехода
      const card = document.createElement(copyOnly ? 'div' : 'a');
      card.className = 'card';
      if (copyOnly) card.dataset.copy = '1';
      else { card.href = l.url; card.rel = 'noopener'; }
      card.dataset.hay = [g.name, l.title, l.url, l.description, (l.tags || []).join(' ')].join(' ').toLowerCase();

      const t = document.createElement('div'); t.className = 't'; t.textContent = l.title || l.url;
      card.appendChild(t);
      if (l.description) { const d = document.createElement('div'); d.className = 'd'; d.textContent = l.description; card.appendChild(d); }

      const u = document.createElement('div');
      u.className = 'url';
      u.textContent = l.url;
      u.title = 'Нажми, чтобы скопировать';
      u.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); copyText(l.url, u); });
      card.appendChild(u);

      if (copyOnly) card.addEventListener('click', () => copyText(l.url, u));

      grid.appendChild(card);
    });

    sec.appendChild(grid);
    out.appendChild(sec);
  });

  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    out.querySelectorAll('section').forEach(sec => {
      let shown = 0;
      sec.querySelectorAll('.card').forEach(c => {
        const hit = !v || c.dataset.hay.includes(v);
        c.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      sec.style.display = shown ? '' : 'none';
    });
    document.getElementById('count').textContent = v
      ? 'найдено: ' + out.querySelectorAll('.card:not([style*="display: none"])').length
      : totalText;
  });

  async function copyText(text, node) {
    try { await navigator.clipboard.writeText(text); say('Скопировано'); return; } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      if (ok) { say('Скопировано'); return; }
    } catch (e) {}
    const r = document.createRange(); r.selectNodeContents(node);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    say('Выделено — нажми Ctrl+C');
  }
  function say(msg) {
    toast.textContent = msg; toast.classList.add('on');
    clearTimeout(say._t); say._t = setTimeout(() => toast.classList.remove('on'), 1600);
  }
  function plural(n, a, b, c) {
    const m = n % 100, k = n % 10;
    if (m > 10 && m < 20) return c;
    if (k === 1) return a;
    if (k > 1 && k < 5) return b;
    return c;
  }
})();
</script>
</body>
</html>
